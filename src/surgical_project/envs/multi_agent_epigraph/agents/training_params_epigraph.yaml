seed: 42
human_model_type: "learnable"  # learnable | fixed_impedance | residual_impedance

human_impedance:
  kp: [0.6, 0.6, 0.6]
  kd: [0.075, 0.075, 0.075]
  lookahead_distance: 0.04
  reference_speed: 0.02
  max_force: 0.03

human_residual:
  max_force: 0.015

force_limit_semantics: "per_axis"

force_scaling:
  human_factor: 25.0
  robot_factor: 25.0

training:
  seed: 42
  lr_decay:
    enabled: true
    final_factor: 0.1

logging:
  enable_console_logging: false

algorithms:
  epigraph:
    rollout_horizon: 256
    data_chunk_length: 16
    actor_lr: 0.0003
    vl_lr: 0.0007
    vh_lr: 0.0007
    gamma: 0.99
    gae_lambda: 0.95
    clip_param: 0.1
    value_clip_param: 0.1
    ppo_epoch: 4
    num_mini_batch: 8
    entropy_coef: 0.003
    max_grad_norm_actor: 5.0
    max_grad_norm_critic: 10.0
    opt_eps: 0.00001
    weight_decay: 0.0
    hidden_size: 256
    recurrent_N: 1
    use_orthogonal: true
    gain: 0.01
    use_clipped_value_loss: true
    huber_delta: 1.0
    max_global_steps: 200000
    per_actor:
      entropy_multiplier:
        human: 1.0
        robot: 1.0

epigraph:
  z:
    min: -450.0
    max: 300.0
    init:
      mode: mixed
      p_min: 0.30
      p_max: 0.20
    encode:
      nz: 6
      mean: -75.0
      scale: 375.0
  root_finder:
    h_tgt: -0.05
    max_iter: 32
    tol: 0.0001

constraints:
  min_z_position: 0.0
  max_robot_force: 0.04
  max_human_force: 0.04
  joint_limits:
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

initial_conditions:
  joint_positions:
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944
    roll: 0.0

trajectory:
  start_point: [0.14, -0.2, 0.03]
  end_point: [0.14, 0.2, 0.03]

constraint_geometry:
  center: [0.14, 0.0, 0.0]
  collision_threshold: 0.0005
  constraint_h_scale: 0.015
  y_range_positive: [0.038, 0.048]
  y_range_negative: [-0.048, -0.038]

reward_parameters:
  completion_threshold: 0.01
  weights:
    zoneA_weight_robot: 0.6
    zoneA_progress_robot: 3.0
    zoneA_deviation_robot: 2.0
    zoneB_weight_robot: 0.7
    zoneB_gap_robot: 1.2
    zoneB_surftangent_robot: 1.8
    zoneB_inward_robot: 0.5
    zoneC_weight_robot: 1.0
    zoneC_offpen_robot: 1.0
    zoneC_inward_robot: 1.0
    zoneC_overlap_robot: 1.0
    zoneD_weight_robot: 0.6
    zoneD_progress_robot: 0.8
    zoneD_deviation_robot: 2.0
    zoneD_inward_robot: 1.0
    zpenalty_robot: 0.0
    completion_robot: 1.0
    timeeff_robot: 0.0
    potential_robot: 0.2
    forceeff_robot: 0.27
    humanaware_robot: 0.27
    zoneA_weight_human: 0.4
    zoneA_progress_human: 3.0
    zoneA_deviation_human: 2.0
    zoneB_weight_human: 1.0
    zoneB_gap_human: 1.2
    zoneB_surftangent_human: 1.8
    zoneB_inward_human: 0.5
    zoneC_weight_human: 1.2
    zoneC_offpen_human: 1.0
    zoneC_inward_human: 1.0
    zoneC_overlap_human: 1.0
    zoneD_weight_human: 0.6
    zoneD_progress_human: 0.8
    zoneD_deviation_human: 2.0
    zoneD_inward_human: 1.0
    zpenalty_human: 0.0
    completion_human: 1.0
    timeeff_human: 0.0
    potential_human: 0.2
    forceeff_human: 0.27
    robotaware_human: 0.27

termination_conditions:
  z_below_zero: false
  edge_collision: false
  safety_distance_threshold: 0.0

obs_scaling:
  factors: [5.0, 16.7, 16.7, 16.7, 5.0, 1.0, 25.0, 25.0, 25.0]

training_monitor:
  eval_episodes: 1
  milestone_episodes: [15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345, 360, 375, 390, 405, 420, 435, 450, 465, 480, 495, 510, 525, 540, 555, 570, 585, 600]
