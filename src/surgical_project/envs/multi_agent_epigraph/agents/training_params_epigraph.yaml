# ===============================================================================
# Epigraph Safe MARL Training Configuration
# Complete unified configuration with all required fields
# ===============================================================================

# ==============================================================================
# Global Settings
# ==============================================================================
training:
  seed: 42
  eval_interval: 10000          # Steps between evaluations
  save_interval: 50000          # Steps between checkpoints
  lr_decay:
    enabled: true               # Enable cosine learning rate decay
    final_factor: 0.1          # Final learning rate = initial * 0.1

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  use_wandb: true              # Enable WandB logging
  enable_console_logging: false # Enable detailed console logging

# ==============================================================================
# Algorithm Configuration (RMAPPO-compatible)
# ==============================================================================
algorithms:
  rmappo:
    # Rollout configuration
    rollout_horizon: 256              # Number of steps per rollout
    data_chunk_length: 16             # RNN sequence length for training
    
    # Learning rates
    actor_lr: 0.0003                  # Actor learning rate (3e-4)
    critic_lr: 0.0007                 # Critic learning rate (7e-4)
    
    # Discount and GAE
    gamma: 0.99                       # Discount factor
    gae_lambda: 0.95                  # GAE lambda
    
    # PPO specific
    clip_param: 0.1                   # PPO clipping parameter
    ppo_epoch: 4                      # Number of PPO epochs per update
    num_mini_batch: 8                 # Number of mini-batches per epoch
    
    # Loss coefficients
    entropy_coef: 0.01               # Entropy regularization coefficient
    
    # Gradient clipping
    max_grad_norm_actor: 5.0          # Actor gradient clipping threshold
    max_grad_norm_critic: 10.0        # Critic gradient clipping threshold
    
    # Optimization
    opt_eps: 0.00001                  # Optimizer epsilon (1e-5)
    weight_decay: 0.0                 # Weight decay
    
    # Network architecture
    hidden_size: 256                  # Hidden layer size
    recurrent_N: 1                    # Number of RNN layers
    use_orthogonal: true              # Use orthogonal initialization
    gain: 0.01                        # Initialization gain
    
    # Value normalization
    use_popart: false                 # Use PopArt normalization
    use_clipped_value_loss: true      # Use clipped value loss
    huber_delta: 1.0                  # Huber loss delta
    
    # Training termination
    max_global_steps: 200000          # Primary termination condition

# ==============================================================================
# Epigraph-Specific Configuration
# ==============================================================================
epigraph:
  z:
    min: -0.6                         # Lower bound for z values
    max: 0.6                          # Upper bound for z values
    init:
      mode: mixed                     # Initialization mode: uniform/extreme/mixed
      p_extreme: 0.3                  # Probability of extreme values (for mixed mode)
    encode:
      nz: 8                           # Z encoding dimension
      mean: 0.0                       # Normalization mean
      scale: 0.2                      # Normalization scale
  
  losses:
    lambda_safe: 1.0                  # Weight for safety advantage in combined advantage
  
  root_finder:
    max_iter: 32                      # Maximum iterations for bisection
    tol: 0.0001                       # Convergence tolerance (1e-4)

# ==============================================================================
# Epigraph Environment Configuration (Reward Composition)
# ==============================================================================
epigraph_env:
  use_timeeff_in_task: 0              # 0/1 flag: Include time efficiency in task rewards
  include_zpenalty_in_safe: 1         # 0/1 flag: Include z-penalty in safety rewards

# ==============================================================================
# Physics Constraints (Runtime Constraints)
# ==============================================================================
constraints:
  min_z_position: 0.0                 # Minimum Z position for safety
  max_robot_force: 0.04               # Maximum robot force output (Newtons)
  max_human_force: 0.04               # Maximum human force output (Newtons)
  
  joint_limits:                       # Joint angle limits (radians)
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# ==============================================================================
# Initial Conditions
# ==============================================================================
initial_conditions:
  joint_positions:                    # Initial joint positions (radians)
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944                     # ~120 degrees
    roll: 0.0

# ==============================================================================
# Trajectory Parameters (Task Logic)
# ==============================================================================
trajectory:
  start_point: [0.14, -0.2, 0.03]     # Starting position in 3D space (meters)
  end_point: [0.14, 0.2, 0.03]        # Target end position in 3D space (meters)

# ==============================================================================
# Constraint Geometry
# ==============================================================================
constraint_geometry:
  center: [0.14, 0.0, 0.0]            # Constraint center position (meters)
  collision_threshold: 0.0005         # Collision detection threshold (meters)
  y_range_positive: [0.038, 0.048]    # Positive Y constraint boundaries
  y_range_negative: [-0.048, -0.038]  # Negative Y constraint boundaries

# ==============================================================================
# Reward Parameters - Four-Zone System
# ==============================================================================
reward_parameters:
  # Unified completion threshold
  completion_threshold: 0.01          # Distance threshold for task completion (meters)
  
  weights:
    # ===== ROBOT (Active Agent) =====
    zoneA_weight_robot: 0.6
    zoneA_progress_robot: 3.0
    zoneA_deviation_robot: 2.0

    zoneB_weight_robot: 0.7
    zoneB_gap_robot: 1.2
    zoneB_surftangent_robot: 1.8
    zoneB_inward_robot: 0.5

    zoneC_weight_robot: 1.0
    zoneC_offpen_robot: 1.0
    zoneC_inward_robot: 1.0
    zoneC_overlap_robot: 1.0

    zoneD_weight_robot: 0.6
    zoneD_progress_robot: 0.8
    zoneD_deviation_robot: 2.0
    zoneD_inward_robot: 1.0

    zpenalty_robot: 0.0
    completion_robot: 1.0
    timeeff_robot: 0.0
    potential_robot: 0.2
    forceeff_robot: 0.27
    humanaware_robot: 0.27

    # ===== HUMAN (Independent Network) =====  
    zoneA_weight_human: 0.6
    zoneA_progress_human: 3.0
    zoneA_deviation_human: 2.0

    zoneB_weight_human: 0.7
    zoneB_gap_human: 1.2
    zoneB_surftangent_human: 1.8
    zoneB_inward_human: 0.5

    zoneC_weight_human: 1.0
    zoneC_offpen_human: 1.0
    zoneC_inward_human: 1.0
    zoneC_overlap_human: 1.0 

    zoneD_weight_human: 0.6
    zoneD_progress_human: 0.8
    zoneD_deviation_human: 2.0
    zoneD_inward_human: 1.0

    zpenalty_human: 0.0
    completion_human: 1.0
    timeeff_human: 0.0
    potential_human: 0.2
    forceeff_human: 0.27
    robotaware_human: 0.27

# ==============================================================================
# Termination Conditions
# ==============================================================================
termination_conditions:
  z_below_zero: false                 # Disable Z termination for now
  edge_collision: false               # Enable direct termination on obstacle entry
  safety_distance_threshold: 0.0      # Direct termination when entering obstacle

# ==============================================================================
# State Normalization Configuration
# ==============================================================================
obs_scaling:
  factors: [5.0, 16.7, 16.7, 16.7, 5.0, 1.0]  # Position and velocity scaling

# ==============================================================================
# Training Monitoring
# ==============================================================================
training_monitor:
  # Milestone episodes for policy evaluation and TopK model selection
  milestone_episodes: [3, 10, 15, 20, 25, 30, 45, 60, 75, 90, 100, 115, 130, 145, 160, 175, 190, 200, 300, 400, 500]