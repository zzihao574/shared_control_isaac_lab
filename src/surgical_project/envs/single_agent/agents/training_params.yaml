# Surgical robot training parameters - Paper-exact implementation with clear time notation
seed: 42
device: 'cuda:0'
max_episodes: 1000
dt: 0.01
log_frequency: 10
max_eval_steps: 500

# Network configuration (paper-aligned RBF)
network_config:
  critic_nodes: 10              # lc = 10
  critic_gaussian_width: 15.0   # ηc,i = 15
  actor_nodes: 10               # la = 10
  actor_gaussian_width: 10.0    # ηa,i = 10
  identifier_nodes: 10          # lid = 10
  identifier_gaussian_width: 100.0  # ηid,i = 100
  mu_range: [-1.0, 1.0]         # μ range
  mu_step: 0.2                  # μc,ij = μa,ij = μid,ij = -1 + 0.2i

# State space dimensions
state_dim: 9                    # z = [x, ẋ, f] ∈ R⁹
action_dim: 3                   # u = [ux, uy, uz] ∈ R³
augmented_state_dim: 12         # z̄ = [z, xd] ∈ R¹²
actor_input_dim: 18             # Za = [q, q̇, ẋr, ẍr] ∈ R¹⁸
# Update observation dimension to 21D
observation_dim: 21             # [x, ẋ, q, q̇, f] ∈ R²¹ (was 21D)

# Trajectory (Y-axis movement)
trajectory:
  start_point: [0.14, -0.2, 0.03]
  end_point: [0.14, 0.2, 0.03]

# Human equilibrium (Y-axis switching)
human_equilibrium:
  middle_point: [0.14, 0.0, 0.03]   # when y ≤ 0
  end_point: [0.14, 0.2, 0.03]      # when y > 0

# Human dynamics (impedance model)
human_dynamics:
  base_damping: [0.14, 0.14, 0.14]         # CH base values
  damping_variation: [0.133, 0.133, 0.133] # CH variation
  base_stiffness: [1.34, 1.34, 1.34]       # KH base values
  stiffness_variation: [1.33, 1.33, 1.33]  # KH variation

# Control parameters
control_parameters:
  K1_gain: 1.0
  K2_gain: 20.0
  Kid_gain: 4.0
  kΓ_gain: 3.5
  psi: 1.0

# Physical constraints
constraints:
  joint_limits:
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
  max_joint_velocity: 100.0
  max_cartesian_velocity: 0.04  # 4cm/s
  min_z_position: 0.0           # z > 0
  max_robot_force: 3.3          # ±3.3N
  max_human_force: 3.3          # ±3.3N

# Network update rates (paper values)
update_rates:
  sigma_critic: 10.0      # σc = 10
  sigma_actor: 10.0       # σa = 10
  sigma_identifier: 10.0  # σid = 10

# Reward parameters
reward_parameters:
  position_tracking_scale: 100.0
  velocity_regulation_scale: 0.01
  force_regulation_scale: 0.05
  control_penalty_scale: 0.008
  safety_penalty_scale: 10.0
  constraint_violation_penalty: -50.0
  completion_reward: 50.0
  completion_threshold: 0.02
  reward_min: -100.0
  reward_max: 75.0

# Safety parameters
safety:
  safety_margin: 0.002
  cbf_gamma: 1.0

# Exploration with PE (persistent excitation)
exploration:
  exploration_noise: 0.0005
  persistent_excitation:
    enabled: true
    amplitude: 0.0005                 # PE amplitude
    num_frequencies: 10               # 10 sinusoids
    base_frequency: 1.0               # ω = 1.0

# Initial conditions
initial_conditions:
  joint_positions:
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944
    roll: 0.0

# Logging
logging:
  log_level: "INFO"
  wandb_logging: false

# Wandb configuration
wandb_config:
  project: "surgical-shared-control"
  tags: ["surgical", "paper-exact", "y-axis"]