# Simplified Training parameters for Surgical Human-Robot Shared Control
# Aligned with the paper's framework and equations

params:
  seed: 42

  # Environment wrapper settings
  env:
    clip_actions: 1.0      # Real world scale actions [-1, 1]
    clip_observations: 1.0  # Real world scale observations

  # Algorithm configuration
  algo:
    name: shared_control_surgical

  # Model configuration  
  model:
    name: surgical_actor_critic
    
  # Network architecture (simplified)
  network:
    name: actor_critic
    separate: false
    
    # Actor network settings
    actor:
      hidden_dims: [256, 128]
      activation: relu
      output_activation: tanh
      
    # Critic network settings  
    critic:
      hidden_dims: [256, 128]
      activation: relu
      
    # Dynamics identifier network
    identifier:
      hidden_dims: [128, 128]
      activation: relu
      
    # Network initialization
    initializer:
      name: orthogonal
      gain: 1.0
      
  # Training configuration
  config:
    name: surgical_shared_control
    env_name: surgical_direct
    device: cuda:0
    
    # Core training hyperparameters (all numeric values)
    learning_rate: 0.0003
    identifier_lr: 0.001
    batch_size: 256
    buffer_size: 50000
    min_buffer_size: 1000
    
    # Training schedule
    max_epochs: 1000
    steps_per_epoch: 500
    update_frequency: 20
    save_frequency: 100
    eval_frequency: 50
    
    # Gradient settings
    max_grad_norm: 0.5
    clip_grad_norm: true
    
    # RL parameters
    gamma: 0.99  # Discount factor
    tau: 0.005   # Soft update coefficient
    
    # Human-robot collaboration parameters (from paper)
    robot_action_weight: 0.7    # α in paper's shared control framework
    human_action_weight: 0.3    # 1-α in paper
    collaboration_adaptation_rate: 0.05
    
    # Human dynamics model parameters (paper Equation 6)
    human_stiffness: 201.0      # KH in CHx˙ + KH(x - xH) = -f
    human_damping: 21.0         # CH in CHx˙ + KH(x - xH) = -f
    interaction_threshold: 0.1
    
    # Cost function weights (paper Equation 13)
    q1_weight: 100.0    # Position tracking weight in r = (x-xd)ᵀQ₁(x-xd) + ...
    q2_weight: 50.0     # Velocity penalty weight for x˙ᵀQ₂x˙
    q3_weight: 200.0    # Force regulation weight for fᵀQ₃f
    r_weight: 0.1       # Control input weight for uᵀRu
    
    # Reward shaping for environment
    reward_scale: 1.0
    collision_penalty_scale: -10.0
    task_completion_scale: 20.0
    smoothness_penalty_scale: -0.05
    human_collaboration_scale: 2.0
    
    # Safety and robustness
    action_noise_std: 0.01
    observation_noise_std: 0.001
    domain_randomization: true
    
    # Workspace and trajectory parameters
    human_workspace_radius: 0.2     # 20cm workspace radius
    human_max_velocity: 0.3         # 30cm/s max human velocity
    trajectory_tracking_scale: 5.0
    workspace_compliance_scale: 2.0
    
    # Physics constraints (real-world scale)
    force_limit: 3.0                # 3N maximum force
    velocity_limit: 0.1             # 0.1 m/s maximum velocity
    collision_tolerance: 0.0001     # 0.1mm collision tolerance
    
    # Logging and monitoring
    log_level: INFO
    tensorboard_logging: true
    wandb_logging: false
    save_best_after: 50
    
    # Environment-specific settings
    num_actors: -1  # Will be set automatically based on num_envs
    normalize_input: true
    normalize_value: true
    normalize_advantage: true
    
    # Exploration settings
    exploration_noise: 0.01
    exploration_decay: 0.995
    min_exploration: 0.001