# training_params.yaml - 官方MADDPG参数对齐版

# Global settings
seed: 42                              # 全局随机种子

# Trajectory parameters
trajectory:
  start_point: [0.14, -0.2, 0.03]
  end_point: [0.14, 0.2, 0.03]
  setpoint_interval: 0.03
  switch_threshold: 0.0075
  total_distance: 0.4

# Constraints - 根据你的任务调整
constraints:
  min_z_position: 0.0
  max_robot_force: 0.02    # 根据你的0.005-0.02N范围调整
  max_human_force: 0.02    # 根据你的0.005-0.02N范围调整
  
  # Joint limits
  joint_limits:
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# Initial conditions
initial_conditions:
  joint_positions:
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944
    roll: 0.0

# Constraint geometry
constraint_geometry:
  center: [0.14, 0.0, 0.0]
  collision_threshold: 0.001
  y_range_positive: [0.038, 0.048]
  y_range_negative: [-0.048, -0.038]

# 奖励参数 - 根据40cm移动和精细控制调整
reward_parameters:
  # Robot权重 - 增加位置跟踪，降低控制惩罚
  robot_weights:
    position_tracking: 8.0       # 增加，因为需要精确跟踪40cm轨迹
    velocity_regulation: 0.2     # 适中，允许1-4cm/s速度
    obstacle_distance: 3.0       # CBF约束权重
    control_input: 0.02          # 降低，因为力范围很小(0.005-0.02N)
    human_awareness: 0.1         # 人机协作感知
    
  # Human权重
  human_weights:
    position_tracking: 6.0       # 人类也需要跟踪轨迹
    velocity_regulation: 0.2     # 速度正则化
    obstacle_distance: 2.0       # CBF约束权重
    force_input: 0.02           # 力输入惩罚，对应小力值
    robot_awareness: 0.15        # 对机器人的感知
    
  # 协作参数
  collaboration_parameters:
    force_conflict_threshold: 0.005  # 降低，对应小力值范围      
    conflict_penalty_scale: 2.0     # 冲突惩罚
    
  # 公共奖励项
  completion_reward: 20.0             # 增加完成奖励，因为40cm是长距离
  completion_threshold: 0.01          # 完成阈值
  
  # CBF参数
  cbf_parameters:
    safety_margin: 0.01
    gamma: 10.0
    epsilon: 0.000001

# 终止条件参数
termination_conditions:
  z_below_zero: true
  edge_collision: true
  safety_distance_threshold: 0.001

# MADDPG配置 - 严格按官方参数，移除非官方参数
maddpg_config:
  # 官方学习参数
  lr_actor: 0.01                      # 官方默认学习率
  lr_critic: 0.01                     # 官方默认学习率  
  gamma: 0.9                          # 官方折扣因子
  batch_size: 256                     # 官方批量大小
  num_units: 64                       # 官方隐藏层单元数
  
  # 官方训练参数
  num_episodes: 600                   # 官方episode数量
  update_interval: 50                 # 官方更新间隔
  min_buffer_size: 1024               # 最小buffer大小
  
  # 网络更新参数 - 官方参数
  tau: 0.01                           # 官方polyak系数
  max_replay_buffer_len: 10000        # Buffer容量

# 智能体和环境配置 - 消除硬编码
agent_config:
  agent_names: ["human", "robot"]     # 智能体名称列表
  num_agents: 2                       # 智能体数量
  observation_dims: [21, 21]          # 各智能体观测维度
  action_dims: [3, 3]                 # 各智能体动作维度
  total_observation_dim: 42           # 总观测维度
  total_action_dim: 6                 # 总动作维度

# 训练监控参数 - 消除硬编码  
training_monitor:
  eval_episode_steps: 500             # 评估时每个episode的步数
  milestone_episodes: [10, 20, 30, 50, 100, 200, 300, 500, 1000, 2000, 3000, 5000]  # 里程碑episode列表

# Environment config
env_config:
  num_envs: 512
  agents: ["human", "robot"]
  centralized_critic: true
  parameter_sharing: false

# Hardware settings
hardware:
  device: "cuda"
  num_workers: 1