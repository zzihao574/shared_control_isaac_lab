# Training parameters for Surgical Human-Robot MARL with MADDPG
# 与MBRL环境对齐的物理参数，保持MARL特有的协作机制

env_config:
  # Environment settings (与MBRL对齐)
  env_name: "surgical_direct_marl"
  num_envs: 512
  episode_length_s: 8.0  # 与MBRL统一
  
  # Multi-agent settings
  agents: ["human", "robot"]
  centralized_critic: true
  parameter_sharing: false
  
  # Observation and action spaces (更新为实际维度)
  observation_spaces:
    human: 18  # 基础12D + 人类特有6D
    robot: 18  # 基础12D + 机器人特有6D
  action_spaces:
    human: 3   # xyz forces
    robot: 3   # xyz forces
  state_space: 24  # 全局状态

# MADDPG配置
maddpg_config:
  # 网络参数
  lr: 0.01
  gamma: 0.95
  batch_size: 1024
  num_units: 64
  
  # 训练参数
  num_episodes: 25000
  max_episode_len: 500
  save_rate: 1000
  
  # 探索参数
  exploration_noise: 0.1
  
  # 网络更新参数
  tau: 0.01  # 软更新参数
  max_replay_buffer_len: 25600  # batch_size * 25

# Agent-specific configurations
agent_configs:
  human:
    # 人类智能体配置
    local_q_func: true   # 使用局部Q函数
    exploration_noise: 0.1
    
    # 人类特有奖励权重
    reward_weights:
      tracking_reward: 100.0
      velocity_penalty: -0.01
      control_penalty: -0.001
      safety_penalty: -10.0
      collision_penalty: -50.0
      completion_reward: 20.0
      collaboration_reward: 2.0
      intention_alignment: 1.5
      
  robot:
    # 机器人智能体配置
    local_q_func: false  # 使用全局Q函数
    exploration_noise: 0.1
    
    # 机器人特有奖励权重
    reward_weights:
      tracking_reward: 100.0
      velocity_penalty: -0.01
      control_penalty: -0.001
      safety_penalty: -10.0
      collision_penalty: -50.0
      completion_reward: 20.0
      collaboration_reward: 2.0
      adaptation_reward: 1.5

# Environment specific parameters (与MBRL对齐)
env_specific:
  # 力参数
  max_forces:
    human: 3.3
    robot: 3.3
    
  # 协作参数 (MARL特有)
  force_sharing_ratio:
    human: 0.6
    robot: 0.4
    
  interaction_coupling: 0.3
  
  # 信任和协作 (MARL特有)
  trust_parameters:
    initial_trust: 0.8
    trust_decay: 0.95
    trust_recovery: 1.02
    conflict_threshold: 2.0
    
  # 人类动力学参数 (与MBRL对齐)
  human_dynamics:
    stiffness: 201.0
    damping: 21.0
    noise_std: 0.1
    reaction_delay: 0.05
    intention_update_rate: 10.0
    
  # 轨迹参数 (与MBRL对齐)
  trajectory:
    target_points:
      - [-0.2, 0.15, 0.03]  # 起始平衡点
      - [0.2, 0.15, 0.03]   # 目标平衡点
    target_reach_threshold: 0.01
    
  # 约束参数 (与MBRL对齐)
  constraints:
    collision_threshold: 0.001
    constraint_center: [0.0, 0.15, 0.0]
    constraint_radius: 0.05
    
  # 任务完成参数 (与MBRL对齐)
  task_completion:
    target_radius: 0.01
    completion_time: 50
    max_completion_bonus: 100.0

# Training schedule
training:
  total_episodes: 25000
  checkpoint_interval: 1000
  evaluation_interval: 1000
  
  # 课程学习 (可选)
  curriculum:
    enabled: false

# Logging and monitoring
logging:
  log_frequency: 100
  save_training_curves: true
  
  custom_metrics:
    - "trust_levels"
    - "collaboration_quality" 
    - "task_completion_rate"
    - "conflict_frequency"
    - "force_alignment"
    - "trajectory_progress"
    
# Hardware settings
hardware:
  device: "cuda"
  num_workers: 1