# Training parameters configuration
# Clean version - only training algorithm and task logic parameters
# Environment structure definitions moved to cfg files

# ==============================================================================
# Global Settings
# ==============================================================================
seed: 42

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  enable_console_logging: true  # Enable detailed console logging for milestone episodes

# ==============================================================================
# Trajectory Parameters (Task Logic)
# ==============================================================================
trajectory:
  start_point: [0.14, -0.2, 0.03]     # Starting position in 3D space (meters)
  end_point: [0.14, 0.2, 0.03]        # Target end position in 3D space (meters)
  switch_threshold: 0.01              # Distance threshold for completion (1cm)

# ==============================================================================
# Physics Constraints (Runtime Constraints)
# ==============================================================================
constraints:
  min_z_position: 0.0                 # Minimum Z position for safety
  max_robot_force: 0.04               # Maximum robot force output (Newtons)
  max_human_force: 0.04               # Maximum human force output (Newtons)
  
  joint_limits:                       # Joint angle limits (radians)
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# ==============================================================================
# Initial Conditions
# ==============================================================================
initial_conditions:
  joint_positions:                    # Initial joint positions (radians)
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944                     # ~120 degrees
    roll: 0.0

# ==============================================================================
# Constraint Geometry
# ==============================================================================
constraint_geometry:
  center: [0.14, 0.0, 0.0]           # Constraint center position (meters)
  collision_threshold: 0.001         # Collision detection threshold (meters)
  y_range_positive: [0.038, 0.048]   # Positive Y constraint boundaries
  y_range_negative: [-0.048, -0.038] # Negative Y constraint boundaries

# ==============================================================================
# Reward Parameters - NEW FOUR-ZONE SYSTEM (FLAT STRUCTURE)
# ==============================================================================
reward_parameters:
  weights:
    # ===== ROBOT =====
    zoneA_weight_robot: 1.0
    zoneA_progress_robot: 1.0
    zoneA_deviation_robot: 1.0

    zoneB_weight_robot: 1.0
    zoneB_gap_robot: 1.0
    zoneB_surftangent_robot: 1.0
    zoneB_inward_robot: 1.0

    zoneC_weight_robot: 1.0
    zoneC_offpen_robot: 1.0
    zoneC_inward_robot: 1.0

    zoneD_weight_robot: 1.0
    zoneD_progress_robot: 1.0
    zoneD_rejoinspeed_robot: 1.0
    zoneD_deviation_robot: 1.0   # α·Deviation
    zoneD_gap_robot: 0.5         # (1-α)·Gap
    zoneD_inward_robot: 1.0

    zpenalty_robot: 0.0
    completion_robot: 0.0
    timeeff_robot: 0.0
    forceeff_robot: 0.0
    humanaware_robot: 0.0

    # ===== HUMAN =====
    zoneA_weight_human: 0.0
    zoneA_progress_human: 0.0
    zoneA_deviation_human: 0.0

    zoneB_weight_human: 0.0
    zoneB_gap_human: 0.0
    zoneB_surftangent_human: 0.0
    zoneB_inward_human: 0.0

    zoneC_weight_human: 0.0
    zoneC_offpen_human: 0.0
    zoneC_inward_human: 0.0

    zoneD_weight_human: 0.0
    zoneD_progress_human: 0.0
    zoneD_rejoinspeed_human: 0.0
    zoneD_deviation_human: 0.0
    zoneD_gap_human: 0.0
    zoneD_inward_human: 0.0

    zpenalty_human: 0.0
    completion_human: 0.0
    timeeff_human: 0.0
    forceeff_human: 0.0
    robotaware_human: 0.0
    
  completion_threshold: 0.01          # Distance threshold for completion (meters)

# ==============================================================================
# Termination Conditions - MODIFIED FOR DIRECT TERMINATION
# ==============================================================================
termination_conditions:
  z_below_zero: false                 # Disable Z termination for now
  edge_collision: true                # Enable direct termination on obstacle entry
  safety_distance_threshold: 0.0     # Direct termination when entering obstacle
  
# ==============================================================================
# MADDPG Algorithm Configuration - OPTIMIZED FOR STABILITY + GROUPED BUFFERS
# ==============================================================================
maddpg_config:
  lr_actor: 0.001                      # Actor learning rate
  lr_critic: 0.001                     # Critic learning rate
  gamma: 0.95                          # Discount factor
  batch_size: 512                     # Training batch size (increased for stability)
  hidden_units: 512                   # Hidden layer units
  num_episodes: 600                   # Target episodes per environment
  update_interval: 100                # Updates every N steps
  min_buffer_size: 6000               # Minimum buffer size to start training
  tau: 0.002                           # Target network update rate (slower for stability)
  max_replay_buffer_len: 100000        # Maximum replay buffer size
  buffer_group_size: 4                # NEW: Number of environments sharing one buffer

# ==============================================================================
# Training Monitoring
# ==============================================================================
training_monitor:
  # Milestone episodes for performance evaluation and TopK model selection
  milestone_episodes: [1, 2, 5, 10, 20, 30, 50, 75, 90, 100, 125, 150, 175, 200, 300, 500]