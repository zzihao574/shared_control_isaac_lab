# training_params.yaml - 简化版

# ==============================================================================
# 全局设置
# ==============================================================================
seed: 42

# ==============================================================================
# 日志配置
# ==============================================================================
logging:
  enable_text_logging: false  # 是否记录详细文本日志

# ==============================================================================
# 轨迹参数
# ==============================================================================
trajectory:
  start_point: [0.14, -0.2, 0.03]
  end_point: [0.14, 0.2, 0.03]
  checkpoint_interval: 0.1
  switch_threshold: 0.01
  total_distance: 0.4

# ==============================================================================
# 约束参数
# ==============================================================================
constraints:
  min_z_position: 0.0
  max_robot_force: 0.02
  max_human_force: 0.02
  
  joint_limits:
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# ==============================================================================
# 初始条件
# ==============================================================================
initial_conditions:
  joint_positions:
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944
    roll: 0.0

# ==============================================================================
# 约束几何
# ==============================================================================
constraint_geometry:
  center: [0.14, 0.0, 0.0]
  collision_threshold: 0.001
  y_range_positive: [0.038, 0.048]
  y_range_negative: [-0.048, -0.038]

# ==============================================================================
# 奖励参数
# ==============================================================================
reward_parameters:
  robot_weights:
    trajectory_tracking: 10.0
    progress: 8.0
    velocity: 1.0
    obstacle_cbf: 4.0
    crossing: 1.0
    force_efficiency: 0.5
    human_awareness: 0.3
    
  human_weights:
    trajectory_tracking: 8.0
    progress: 7.0
    velocity: 0.8
    obstacle_cbf: 4.0
    crossing: 0.8
    force_efficiency: 0.4
    robot_awareness: 0.25
    
  completion_reward: 50.0
  completion_threshold: 0.01
  
  cbf_parameters:
    safety_margin: 0.01
    gamma: 10.0
    epsilon: 0.000001

# ==============================================================================
# 终止条件
# ==============================================================================
termination_conditions:
  z_below_zero: false
  edge_collision: false
  safety_distance_threshold: 0.001

# ==============================================================================
# MADDPG配置
# ==============================================================================
maddpg_config:
  lr_actor: 0.01
  lr_critic: 0.01
  gamma: 0.9
  batch_size: 512
  num_units: 64
  num_episodes: 600
  update_interval: 100
  min_buffer_size: 1024
  tau: 0.01
  max_replay_buffer_len: 10000

# ==============================================================================
# 智能体配置
# ==============================================================================
agent_config:
  agent_names: ["human", "robot"]
  num_agents: 2
  observation_dims: [21, 21]
  action_dims: [3, 3]
  total_observation_dim: 42
  total_action_dim: 6

# ==============================================================================
# 训练监控
# ==============================================================================
training_monitor:
  milestone_episodes: [2, 10, 20, 30, 50, 75, 90, 100, 125, 150, 175, 200, 300, 500]

# ==============================================================================
# 环境配置
# ==============================================================================
env_config:
  num_envs: 512
  agents: ["human", "robot"]

# ==============================================================================
# 硬件配置
# ==============================================================================
hardware:
  device: "cuda"