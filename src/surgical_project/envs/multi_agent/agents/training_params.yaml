# training_params.yaml - 修复版本

# Trajectory parameters
trajectory:
  start_point: [0.14, -0.2, 0.03]
  end_point: [0.14, 0.2, 0.03]
  setpoint_interval: 0.03
  switch_threshold: 0.0075
  total_distance: 0.4

# Constraints - 调整力限制
constraints:
  max_cartesian_velocity: 0.08
  min_z_position: 0.0
  max_robot_force: 0.03  # 适中的力限制
  max_human_force: 0.03
  
  # Joint limits
  joint_limits:
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# Initial conditions
initial_conditions:
  joint_positions:
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944
    roll: 0.0

# Constraint geometry
constraint_geometry:
  center: [0.14, 0.0, 0.0]
  collision_threshold: 0.001
  y_range_positive: [0.038, 0.048]
  y_range_negative: [-0.048, -0.038]

# Reward parameters
reward_parameters:
  robot_weights:
    position_tracking: 100.0
    velocity_regulation: 0.5
    obstacle_distance: 50.0
    control_input: 0.01
    
  human_weights:
    position_tracking: 80.0
    velocity_regulation: 0.5
    obstacle_distance: 30.0
    force_input: 0.01
    
  collaboration_parameters:
    force_conflict_threshold: 1.0
    conflict_penalty_scale: -5.0
    
  completion_reward: 100.0
  collision_penalty: -100.0
  completion_threshold: 0.01
  
  cbf_parameters:
    safety_margin: 0.01
    gamma: 10.0
    epsilon: 0.000001

# MADDPG配置
maddpg_config:
  lr: 0.0003
  lr_actor: 0.0003
  lr_critic: 0.001
  gamma: 0.95
  batch_size: 512
  num_units: 64
  
  # 训练参数
  num_episodes: 25000
  max_episode_len: 500
  save_rate: 1000
  update_interval: 100
  min_buffer_size: 2048
  
  # 探索参数
  exploration_noise: 0.1
  noise_decay: 0.995
  min_noise: 0.01
  
  # 网络更新参数
  tau: 0.01
  max_replay_buffer_len: 25600

# Environment config
env_config:
  num_envs: 512
  episode_length_s: 15.0
  agents: ["human", "robot"]
  centralized_critic: true
  parameter_sharing: false

# Agent-specific configurations
agent_configs:
  human:
    local_q_func: true
    exploration_noise: 0.1
      
  robot:
    local_q_func: false
    exploration_noise: 0.1

# Hardware settings
hardware:
  device: "cuda"
  num_workers: 1