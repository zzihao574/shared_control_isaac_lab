# Training parameters configuration with residual connections
# Features configurable network layers, exponential noise scheduling, and per-env scaling

# ==============================================================================
# Global Settings
# ==============================================================================
seed: 42

# Human force model. Missing key remains backward-compatible with "learnable".
human_model_type: "learnable"  # learnable | fixed_impedance | residual_impedance

human_impedance:
  kp: [0.8, 0.8, 0.8]              # Position gains (N/m)
  kd: [0.1, 0.1, 0.1]              # Velocity gains (N*s/m)
  lookahead_distance: 0.04          # Look-ahead equilibrium distance (m)
  reference_speed: 0.02             # Tangential reference speed (m/s)

# Residual uses the existing human actor's full per-axis force range. It can
# therefore cancel or reverse the bounded impedance prior before final clipping.
human_residual:
  mapping: "policy_tanh_times_max_human_force"
  can_override_impedance: true

force_limit_semantics: "per_axis"

# ==============================================================================
# Network Architecture Configuration with Residual Connections
# ==============================================================================
networks:
  actor:
    hidden_layers: [128, 128, 128, 128]
    input_bypass_layers: [1, 2]  # Enable residual connections at layers 1 and 2
    orthogonal_init: true
    ortho_gain_hidden: 1.414
    ortho_gain_output: 0.01    
  critic:
    hidden_layers: [256, 256, 128, 128]
    input_bypass_layers: [0, 2]  # Enable residual connections at layers 0 and 2
    orthogonal_init: true
    ortho_gain_hidden: 1.414
    ortho_gain_output: 0.01

# ==============================================================================
# State Normalization Configuration
# ==============================================================================
obs_scaling:
  # Fixed scaling factors 
  factors: [5.0, 16.7, 16.7, 16.7, 5.0, 1.0]

# ==============================================================================
# Exploration Configuration
# ==============================================================================
exploration:
  sigma_start: 0.8   # Initial noise = 0.6 × max_action
  sigma_end: 0.1     # Final noise = 0.1 × max_action
  decay_k: 4.0       # Decay rate for exponential schedule

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  enable_console_logging: false  # Enable detailed console logging for debugging

# ==============================================================================
# Trajectory Parameters (Task Logic)
# ==============================================================================
trajectory:
  start_point: [0.14, -0.2, 0.03]     # Starting position in 3D space (meters)
  end_point: [0.14, 0.2, 0.03]        # Target end position in 3D space (meters)

# ==============================================================================
# Physics Constraints (Runtime Constraints)
# ==============================================================================
constraints:
  min_z_position: 0.0                 # Minimum Z position for safety
  max_robot_force: 0.04               # Maximum robot force output (Newtons)
  max_human_force: 0.04               # Maximum human force output (Newtons)
  
  joint_limits:                       # Joint angle limits (radians)
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# ==============================================================================
# Initial Conditions
# ==============================================================================
initial_conditions:
  joint_positions:                    # Initial joint positions (radians)
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944                     # ~120 degrees
    roll: 0.0

# ==============================================================================
# Constraint Geometry
# ==============================================================================
constraint_geometry:
  center: [0.14, 0.0, 0.0]           # Constraint center position (meters)
  collision_threshold: 0.0005         # Collision detection threshold (meters)
  y_range_positive: [0.038, 0.048]   # Positive Y constraint boundaries
  y_range_negative: [-0.048, -0.038] # Negative Y constraint boundaries

# ==============================================================================
# Reward Parameters - Four-Zone System (Flat Structure)
# ==============================================================================
reward_parameters:
  # Unified completion threshold
  completion_threshold: 0.01          # Distance threshold for task completion (meters)
  
  weights:
    # ===== ROBOT (Active Agent) =====
    zoneA_weight_robot: 0.6
    zoneA_progress_robot: 3.0
    zoneA_deviation_robot: 2.0

    zoneB_weight_robot: 0.7
    zoneB_gap_robot: 1.2
    zoneB_surftangent_robot: 1.8
    zoneB_inward_robot: 0.5

    zoneC_weight_robot: 1.0
    zoneC_offpen_robot: 1.0
    zoneC_inward_robot: 1.0
    zoneC_overlap_robot: 1.0

    zoneD_weight_robot: 0.6
    zoneD_progress_robot: 0.8
    zoneD_deviation_robot: 2.0
    zoneD_inward_robot: 1.0

    zpenalty_robot: 0.0
    completion_robot: 1.0
    timeeff_robot: 0.0
    potential_robot: 0.2
    forceeff_robot: 0.27
    humanaware_robot: 0.27

    # ===== HUMAN (Independent Network) =====  
    zoneA_weight_human: 0.6
    zoneA_progress_human: 3.0
    zoneA_deviation_human: 2.0

    zoneB_weight_human: 0.7
    zoneB_gap_human: 1.2
    zoneB_surftangent_human: 1.8
    zoneB_inward_human: 0.5

    zoneC_weight_human: 1.0
    zoneC_offpen_human: 1.0
    zoneC_inward_human: 1.0
    zoneC_overlap_human: 1.0 

    zoneD_weight_human: 0.6
    zoneD_progress_human: 0.8
    zoneD_deviation_human: 2.0
    zoneD_inward_human: 1.0

    zpenalty_human: 0.0
    completion_human: 1.0
    timeeff_human: 0.0
    potential_human: 0.2
    forceeff_human: 0.27
    robotaware_human: 0.27

# ==============================================================================
# Termination Conditions
# ==============================================================================
termination_conditions:
  z_below_zero: false                 # Disable Z termination for now
  edge_collision: false               # Enable direct termination on obstacle entry
  safety_distance_threshold: 0.0     # Direct termination when entering obstacle
  
# ==============================================================================
# MADDPG Algorithm Configuration - Optimized for Shared Networks with Residuals
# ==============================================================================
maddpg_config:
  lr_actor: 0.0007                    # Actor learning rate
  lr_critic: 0.001                    # Critic learning rate
  gamma: 0.99                        # Discount factor
  batch_size: 1024                    # Training batch size (increased for stability)
  max_global_steps: 200000           # Primary termination condition: stop after this many training steps
  update_interval: 5                 # Updates every N steps
  min_buffer_size: 6000              # Minimum buffer size to start training (per-env baseline)
  tau: 0.005                         # Target network update rate (slower for stability)
  max_replay_buffer_len: 8400       # Maximum replay buffer size (per-env baseline)

# ==============================================================================
# Training Monitoring
# ==============================================================================
training_monitor:
  milestone_episodes: [15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345, 360, 375, 390, 405, 420, 435, 450, 465, 480, 495, 510, 525, 540, 555, 570, 585, 600]
