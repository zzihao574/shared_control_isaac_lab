# Training parameters configuration with residual connections
# Features configurable network layers, exponential noise scheduling, and per-env scaling

# ==============================================================================
# Global Settings
# ==============================================================================
seed: 42

# ==============================================================================
# Network Architecture Configuration with Residual Connections
# ==============================================================================
networks:
  actor:
    hidden_layers: [128, 128, 128, 128]
    input_bypass_layers: [1, 2]  # Enable residual connections at layers 1 and 2
    orthogonal_init: true
    ortho_gain_hidden: 1.414
    ortho_gain_output: 0.01    
  critic:
    hidden_layers: [256, 256, 128, 128]
    input_bypass_layers: [0, 2]  # Enable residual connections at layers 0 and 2
    orthogonal_init: true
    ortho_gain_hidden: 1.414
    ortho_gain_output: 0.01

# ==============================================================================
# State Normalization Configuration
# ==============================================================================
obs_scaling:
  # Fixed scaling factors (ordered by obs concatenation: pos[3] + vel[3] + dist[1] = 7D)
  factors: [10.0, 10.0, 10.0, 50.0, 50.0, 50.0, 10.0]

# ==============================================================================
# Exploration Configuration
# ==============================================================================
exploration:
  sigma_start: 0.6   # Initial noise = 0.6 × max_action
  sigma_end: 0.1     # Final noise = 0.1 × max_action
  decay_k: 3.0       # Decay rate for exponential schedule

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  enable_console_logging: true  # Enable detailed console logging for debugging

# ==============================================================================
# Trajectory Parameters (Task Logic)
# ==============================================================================
trajectory:
  start_point: [0.14, -0.2, 0.03]     # Starting position in 3D space (meters)
  end_point: [0.14, 0.2, 0.03]        # Target end position in 3D space (meters)

# ==============================================================================
# Physics Constraints (Runtime Constraints)
# ==============================================================================
constraints:
  min_z_position: 0.0                 # Minimum Z position for safety
  max_robot_force: 0.04               # Maximum robot force output (Newtons)
  max_human_force: 0.04               # Maximum human force output (Newtons)
  
  joint_limits:                       # Joint angle limits (radians)
    waist: [-0.98, 0.98]
    shoulder: [0.0, 1.75]
    elbow: [-0.7854, 1.5]
    yaw: [-1.5, 1.5]
    pitch: [0.0, 2.5]
    roll: [-2.58, 2.58]

# ==============================================================================
# Initial Conditions
# ==============================================================================
initial_conditions:
  joint_positions:                    # Initial joint positions (radians)
    waist: -0.96
    shoulder: 0.0
    elbow: 1.0
    yaw: 0.0
    pitch: 2.0944                     # ~120 degrees
    roll: 0.0

# ==============================================================================
# Constraint Geometry
# ==============================================================================
constraint_geometry:
  center: [0.14, 0.0, 0.0]           # Constraint center position (meters)
  collision_threshold: 0.0005         # Collision detection threshold (meters)
  y_range_positive: [0.038, 0.048]   # Positive Y constraint boundaries
  y_range_negative: [-0.048, -0.038] # Negative Y constraint boundaries

# ==============================================================================
# Reward Parameters - Four-Zone System (Flat Structure)
# ==============================================================================
reward_parameters:
  # Unified completion threshold
  completion_threshold: 0.01          # Distance threshold for task completion (meters)
  
  weights:
    # ===== ROBOT (Active Agent) =====
    zoneA_weight_robot: 2.4
    zoneA_progress_robot: 3.0
    zoneA_deviation_robot: 1.5

    zoneB_weight_robot: 2.4
    zoneB_gap_robot: 1.0
    zoneB_surftangent_robot: 1.0
    zoneB_inward_robot: 1.0

    zoneC_weight_robot: 4.0
    zoneC_offpen_robot: 1.0
    zoneC_inward_robot: 1.0
    zoneC_overlap_robot: 1.0          # Collision penalty weight

    zoneD_weight_robot: 2.4
    zoneD_progress_robot: 1.0
    zoneD_deviation_robot: 1.5
    zoneD_inward_robot: 1.0

    zpenalty_robot: 0.0
    completion_robot: 4.0
    timeeff_robot: 0.0
    potential_robot: 0.4              # Potential reward weight for robot
    forceeff_robot: 0.7
    humanaware_robot: 0.7

    # ===== HUMAN (Disabled in Single-Agent Mode) =====  
    zoneA_weight_human: 2.4
    zoneA_progress_human: 3.0
    zoneA_deviation_human: 1.5

    zoneB_weight_human: 2.4
    zoneB_gap_human: 1.0
    zoneB_surftangent_human: 1.0
    zoneB_inward_human: 1.0

    zoneC_weight_human: 4.0
    zoneC_offpen_human: 1.0
    zoneC_inward_human: 1.0
    zoneC_overlap_human: 1.0 

    zoneD_weight_human: 2.4
    zoneD_progress_human: 1.0
    zoneD_deviation_human: 1.5
    zoneD_inward_human: 1.0

    zpenalty_human: 0.0
    completion_human: 4.0
    timeeff_human: 0.0
    potential_human: 0.4              # Potential reward weight for human
    forceeff_human: 0.7
    robotaware_human: 0.7

# ==============================================================================
# Termination Conditions
# ==============================================================================
termination_conditions:
  z_below_zero: false                 # Disable Z termination for now
  edge_collision: false               # Enable direct termination on obstacle entry
  safety_distance_threshold: 0.0     # Direct termination when entering obstacle
  
# ==============================================================================
# MADDPG Algorithm Configuration - Optimized for Shared Networks with Residuals
# ==============================================================================
maddpg_config:
  lr_actor: 0.0007                    # Actor learning rate
  lr_critic: 0.001                    # Critic learning rate
  gamma: 0.99                        # Discount factor
  batch_size: 1024                    # Training batch size (increased for stability)
  max_global_steps: 200000           # Primary termination condition: stop after this many training steps
  update_interval: 10                 # Updates every N steps
  min_buffer_size: 6000              # Minimum buffer size to start training (per-env baseline)
  tau: 0.002                         # Target network update rate (slower for stability)
  max_replay_buffer_len: 7200       # Maximum replay buffer size (per-env baseline)

# ==============================================================================
# Training Monitoring
# ==============================================================================
training_monitor:
  # Milestone episodes for policy evaluation and TopK model selection
  # Episodes are counted as sum of all environment completions
  # These are per-env baselines and will be auto-scaled by --num_envs
  milestone_episodes: [10, 15, 20, 25, 30, 50, 75, 100, 150, 200, 300, 400, 500]
